name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ohrwurm

jobs:
  check:
    name: Prüfen (tsc, go vet, go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Client-Typprüfung
        uses: docker/build-push-action@v6
        with:
          context: .
          target: client-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Relay vet + test
        uses: docker/build-push-action@v6
        with:
          context: .
          target: relay-test
          cache-from: type=gha

  image:
    name: Image bauen${{ github.event_name != 'pull_request' && ' und veröffentlichen' || '' }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bauen (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: Binaries (Release)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Binaries bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          target: export
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          outputs: type=local,dest=dist
          cache-from: type=gha
      - name: Umbenennen und Prüfsummen
        run: |
          mkdir -p release
          for d in dist/linux_*; do
            arch="${d#dist/linux_}"
            cp "$d/ohrwurm-relay" "release/ohrwurm-relay-linux-$arch"
          done
          (cd release && sha256sum * > SHA256SUMS)
      - name: GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
